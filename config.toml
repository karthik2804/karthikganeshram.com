baseURL = "https://karthikganeshram.com/"
locale = "en-US"
title = "Karthik Ganeshram"
theme = "karthik-www-theme"
enableRobotsTXT = true

[author]
name = "Karthik Ganeshram"
email = "raams.karthik@gmail.com"

[permalinks]
blog = "/blog/:title/"

[markup.goldmark.renderer]
# Older tutorial posts contain working HTML, script, and video examples.
unsafe = true
hardWraps = true

[markup.highlight]
style = "manni"

[security.exec]
allow = [
    '^(dart-)?sass$',
    '^go$',
    '^git$',
    '^node$',
    '^postcss$',
    '^tailwindcss$',
]
