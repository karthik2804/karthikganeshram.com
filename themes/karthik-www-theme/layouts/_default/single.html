{{ define "main" }}
  <article class="journal-entry">
    <header class="journal-header">
      {{ with .Params.categories }}<p class="section-kicker">{{ delimit . " · " }}</p>{{ end }}
      <h1>{{ .Title }}</h1>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
    </header>
    {{ with .Params.header_image }}
      <figure class="journal-cover"><img src="{{ . | relURL }}" alt="Header image for {{ $.Title }}" /></figure>
    {{ end }}
    <div class="journal-content prose prose-lg">{{ .Content }}</div>
  </article>
{{ end }}
