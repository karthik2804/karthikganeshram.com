{{ define "main" }}
  <header class="page-hero">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>
  {{ $posts := (where site.RegularPages "Section" "blog").ByDate.Reverse }}
  <section class="post-list-section" aria-labelledby="all-posts">
    <div class="section-heading"><h2 id="all-posts">All posts</h2></div>
    <div class="post-list">{{ range $posts }}{{ partial "list_item" . }}{{ end }}</div>
  </section>
{{ end }}
