<article class="post-list-item">
  <div class="post-list-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan" }}</time>
    {{ with .Params.categories }}<span>{{ index . 0 | humanize }}</span>{{ end }}
  </div>
  <div class="post-list-copy">
    <h4><a href="{{ .RelPermalink }}">{{ .Title }}</a></h4>
    <p>{{ .Description | default (.Summary | plainify | truncate 145) }}</p>
  </div>
  <span class="post-list-arrow" aria-hidden="true">↗</span>
</article>
