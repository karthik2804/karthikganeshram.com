<article class="post-list-item">
  <div>
    {{ with .Params.categories }}<p class="post-list-category">{{ index . 0 | humanize }}</p>{{ end }}
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  </div>
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
</article>
